name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Secret Scan
        run: npm run secret:scan

      - name: Audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm run test

      - name: Build Server
        run: npm run build:server

      - name: Build Web
        run: npm run build:web

      - name: E2E Tests
        run: npm run test:e2e --prefix packages/web
        env:
          TEST_CLERK_SESSION: ${{ secrets.TEST_CLERK_SESSION }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_SESSION_ID: ${{ secrets.TEST_SESSION_ID }}
          BASE_URL: https://eddieai.online
          SERVER_URL: https://flowgraph-n8xj.onrender.com
