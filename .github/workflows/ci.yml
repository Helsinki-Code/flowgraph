name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Secret Scan
        run: npm run secret:scan

      - name: Tests
        run: npm run test

      - name: Build Server
        run: npm run build:server

      - name: Build Web
        run: npm run build:web
