services:
  - type: web
    name: flowgraph-server
    env: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=packages/storage && npm run build --workspace=packages/sdk && npm run build --workspace=packages/server
    startCommand: node packages/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: flowgraph-web
    env: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=packages/web
    startCommand: npx astro preview --host 0.0.0.0
    envVars:
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
