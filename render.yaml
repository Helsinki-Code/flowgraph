services:
  - type: web
    name: flowgraph-server
    env: node
    plan: starter
    rootDir: packages/server
    buildCommand: npm install --omit=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: turso
      - key: DATABASE_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://flowgraph.onrender.com

  - type: static_site
    name: flowgraph-web
    buildCommand: npm install && npm run build --workspace=packages/web
    staticPublishPath: packages/web/dist
    envVars:
      - key: PUBLIC_API_URL
        value: https://flowgraph-server.onrender.com
      - key: PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
