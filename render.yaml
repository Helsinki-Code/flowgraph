services:
  - type: web
    name: flowgraph-server
    env: node
    plan: starter
    rootDir: packages/server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: flowgraph-web
    env: node
    plan: starter
    rootDir: packages/web
    buildCommand: npm install && npm run build
    startCommand: npx astro preview
    envVars:
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
